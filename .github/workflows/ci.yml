name: CPU quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  safety:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cmake -S cpp -B build/safety -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/safety --config Release --parallel 2
      - run: ctest --test-dir build/safety -C Release --output-on-failure
      - run: cmake -S robotics/command_expiry -B build/expiry -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/expiry --config Release --parallel 2
      - run: ctest --test-dir build/expiry -C Release --output-on-failure
      - if: runner.os == 'Linux'
        run: python scripts/check_robotics_cpp.py --validator build/safety/oak-validate --policy configs/robotics/policy_v1.json
      - if: runner.os == 'Windows'
        run: python scripts/check_robotics_cpp.py --validator build/safety/Release/oak-validate.exe --policy configs/robotics/policy_v1.json
      - if: runner.os == 'Linux'
        run: |
          cmake -S cpp -B build/asan -DCMAKE_BUILD_TYPE=Debug -DOAK_SANITIZERS=ON
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan --output-on-failure
          cmake -S robotics/command_expiry -B build/expiry-asan -DCMAKE_BUILD_TYPE=Debug -DOAK_SANITIZERS=ON
          cmake --build build/expiry-asan --parallel 2
          ctest --test-dir build/expiry-asan --output-on-failure
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python scripts/verify_phase31_archive.py
      - run: python -m pytest -m "not hardware" --junitxml=test-results.xml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
