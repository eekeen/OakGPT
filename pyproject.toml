[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oakgpt"
version = "0.1.0"
description = "Reproducible local language model research on consumer hardware"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1,<2"]
research = ["pyarrow>=18,<24", "matplotlib>=3.9,<4"]
report = ["reportlab>=4,<6", "pymupdf>=1.24,<2"]

[project.scripts]
oakgpt = "oakgpt.cli:main"
oakgpt-research = "oakgpt.research.cli:main"
oakgpt-robot = "oakgpt.robotics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/oakgpt"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end local tests", "hardware: requires externally configured hardware/model"]
